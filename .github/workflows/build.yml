name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy && (cd tools && go mod tidy)
          git diff --compact-summary --exit-code -- go.mod go.sum tools/go.mod tools/go.sum || \
            (echo; echo "go.mod/go.sum are not tidy. Run 'go mod tidy' (also in tools/) and commit."; exit 1)
      - run: make build-ci
      - run: make test
      # From v1.0.0, TestSchemaCompatibility (in make test) compares the
      # schemas with the latest release's, in testdata/schema-baseline.json.
      # Only a release pull request may change it, and it must: the baseline
      # must then be the regenerated schemas, without changes to the
      # provider's code, which would be compared with themselves.
      - name: Check that only a release changes the schema baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          baseline=internal/provider/testdata/schema-baseline.json
          case "$PR_TITLE" in
            "chore: release "*)
              go test ./internal/provider -run TestSchemaCompatibility -count=1 -update
              git diff --exit-code -- "$baseline" || {
                echo "::error file=$baseline::Regenerate the schema baseline: go test ./internal/provider -run TestSchemaCompatibility -update"
                exit 1
              }
              code=$(git diff --name-only "$BASE_SHA" HEAD -- 'internal/provider/*.go' | grep -v '_test\.go$' || true)
              if [ -n "$code" ] && git diff --name-status "$BASE_SHA" HEAD -- "$baseline" | grep -q '^M'; then
                echo "::error file=$baseline::A release pull request that changes the schema baseline may not change the provider's code:"
                echo "$code"
                exit 1
              fi
              ;;
            *)
              if git diff --name-status "$BASE_SHA" HEAD -- "$baseline" | grep -q '^[MD]'; then
                echo "::error file=$baseline::Only a release pull request (titled 'chore: release …') may change the schema baseline."
                exit 1
              fi
              ;;
          esac
