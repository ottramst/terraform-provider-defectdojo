# See GitHub's documentation for more information on this file:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# The DefectDojo images are not updated here: the supported versions are listed
# in .github/defectdojo-versions.json and bumped by hand when a minor release is
# out (see CONTRIBUTING.md). The Upstream workflow opens an issue for that.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      # Group all terraform-plugin-(go|framework|testing|...) dependencies together
      "terraform-plugin":
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"
      "go-minor-patch":
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      "tools":
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    groups:
      "github-actions":
        patterns:
          - "*" # Group all GitHub Actions dependencies together
