name: Feature request
description: Suggest a new resource, data source, attribute, or improvement.
labels: ["type/feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like the provider to do, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Proposed configuration
      description: Optional. How you would like to write it in Terraform.
      render: hcl
  - type: input
    id: defectdojo-version
    attributes:
      label: DefectDojo version
      description: The DefectDojo version that provides the underlying feature, if known.
      placeholder: "3.5.0"
  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional. Links to DefectDojo documentation, API endpoints (see the API v2 docs of your DefectDojo at `/api/v2/oa3/swagger-ui/`), or related issues.
